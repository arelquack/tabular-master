
services:
  open-webui:
  
    image: ghcr.io/open-webui/open-webui:main-slim
    container_name: open-webui
    restart: unless-stopped

    network_mode: host

    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}

    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
